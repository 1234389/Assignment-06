<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcmeDev - Navbar & Banner Task</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Logo Bar -->
  <header class="card-nav">
    <div class="logo">
      <div class="logo-box">&lt;/&gt;</div>
      <h2>AcmeDev</h2>
    </div>
  </header>

  <!-- Main Navbar -->
  <nav class="card-nav main-navbar">
    <ul class="nav-links">
      <li class="active">Home</li>
      <li>Features</li>
      <li>Pricing</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
    <div class="nav-btns">
      <button class="btn light">Log In</button>
      <button class="btn dark">Get Started</button>
    </div>
  </nav>

  <!-- Banner Section -->
  <main class="banner">
    
    <!-- Left Side -->
    <div class="left">
      <h1>Create A Navbar And<br>Banner Section<br>of the Attached Image</h1>
      <p class="due">📅 Due Date: Oct 17, 2026</p>

      <h3 class="obj-title">Objective</h3>
      <div class="obj-card">
        <p>you guys have to make it using<br>the following things:</p>
        <ul>
          <li>CSS variables</li>
          <li>Flexbox</li>
        </ul>
      </div>
    </div>

    <!-- Right Side -->
    <div class="right">
      <div class="right-wrap">
        <div class="col">
          <div class="mini-card">
            <div class="icon-box">&lt;/&gt;</div>
            <p>CSS Variables</p>
          </div>
          <div class="mini-card">
            <div class="icon-row">
              <span></span><span></span><span></span>
            </div>
            <p>Flexbox Layout</p>
          </div>
        </div>
        <div class="big-card">
          <!-- Flex Power Icon -->
          <div class="muscle-art">
            <div class="arm left"></div>
            <div class="arm right"></div>
            <div class="chip"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

</body>
</html>
